<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Analyzer</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        textarea {
            height: 180px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #222;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🤖 AI Resume Analyzer</h1>

    <p>
        Upload your resume and enter a job description to analyze your skills.
    </p>

    <form action="/analyze" method="POST" enctype="multipart/form-data">

        <label>Upload Resume (PDF)</label>

        <input
            type="file"
            name="resume"
            accept=".pdf"
            required
        >

        <label>Job Description</label>

        <textarea
            name="job_description"
            placeholder="Paste the job description here..."
            required
        ></textarea>

        <button type="submit">
            Analyze Resume 🚀
        </button>

    </form>

</div>

</body>
</html>
